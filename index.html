<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ollie – Personal Loan Tracker</title>

    <!-- PWA -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#F6F6F4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ollie" />

    <!-- Apply the saved theme before first paint (see src/features/theme/themeStore.ts) -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('loan-tracker-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121212' : '#F6F6F4');
        } catch (e) {}
      })();
    </script>

    <!-- Icons -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
